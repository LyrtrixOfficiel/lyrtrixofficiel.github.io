[build]
  command = "npm run build"
  publish = "dist"

# `/api/contenu` sert l'espace d'edition. La route est declaree dans la
# fonction elle-meme (`export const config`), pas ici.
[functions]
  directory = "netlify/functions"

# Les anciennes URL du site Duda n'avaient pas de .html — on les conserve.
[[redirects]]
  from = "/reflexologie-plantaire"
  to = "/reflexologie-plantaire.html"
  status = 301

[[redirects]]
  from = "/psychogenealogie"
  to = "/psychogenealogie.html"
  status = 301

[[redirects]]
  from = "/soin-energetique"
  to = "/soin-energetique.html"
  status = 301

[[redirects]]
  from = "/sauna-japonais"
  to = "/sauna-japonais.html"
  status = 301

[[redirects]]
  from = "/mes-tarifs"
  to = "/tarifs.html"
  status = 301

[[redirects]]
  from = "/me-contacter"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301

# Les videos et posters ne changent jamais : cache long.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

<!doctype html><html><head><meta charset="utf-8"><title>attente</title>
<style>html,body{margin:0}iframe{width:390px;height:800px;border:0}</style></head>
<body>
<iframe id="f" src="./index.html"></iframe>
<pre id="R">rien</pre>
<script>
function go(){
  var f=document.getElementById('f'), d=f.contentDocument, w=f.contentWindow;
  var out={};
  // videos restantes
  out.videos=[].map.call(d.querySelectorAll('video'),function(v){var r=v.getBoundingClientRect();
    return v.className+' '+Math.round(r.width)+'x'+Math.round(r.height)+' top='+Math.round(r.top+w.scrollY)+' paused='+v.paused;});
  var bloc=d.querySelector('.entree-bloc');
  var bc=bloc.querySelector('a.bouton.clair');
  var rb=bc.getBoundingClientRect();
  var cx=rb.left+rb.width/2, cy=rb.top+rb.height/2;
  out.pileSousBouton=[].map.call(d.elementsFromPoint(cx,cy),function(e){
    var c=w.getComputedStyle(e);
    return e.tagName+'.'+(e.className||'').toString().replace(/\s+/g,'.')+' | bg='+c.backgroundColor+' | img='+(c.backgroundImage==='none'?'non':'oui');
  });
  // fond de l entete
  var ent=d.querySelector('header')||d.querySelector('.entree');
  out.entete=(function(){var c=w.getComputedStyle(d.querySelector('.entree'));
    return {bg:c.backgroundColor, bgimg:c.backgroundImage.slice(0,120), minH:c.minHeight, h:Math.round(d.querySelector('.entree').getBoundingClientRect().height)};})();
  var voile=d.querySelector('.entree .voile')||d.querySelector('.voile');
  if(voile){var cv=w.getComputedStyle(voile);var rv=voile.getBoundingClientRect();
    out.voile={rect:Math.round(rv.width)+'x'+Math.round(rv.height), bgimg:cv.backgroundImage.slice(0,160), pos:cv.position};}
  // le film-decor derriere l accueil existe-t-il encore
  out.filmDecor=d.querySelectorAll('video.film-decor').length;
  out.filmDecorConteneur=(function(){var e=d.querySelector('.entree .film-fond, .entree .decor, .entree > div');
    if(!e)return 'aucun'; var c=w.getComputedStyle(e); var r=e.getBoundingClientRect();
    return e.className+' '+Math.round(r.width)+'x'+Math.round(r.height)+' enfants='+e.children.length+' bg='+c.backgroundColor;})();
  // le deuxieme bouton clair : ou est-il
  var tous=[].slice.call(d.querySelectorAll('a.bouton.clair'));
  out.boutonsClairs=tous.map(function(b){var r=b.getBoundingClientRect();
    var p=b.closest('.appel-carte,.verre,section,header');
    return Math.round(r.width)+'x'+Math.round(r.height)+' topDoc='+Math.round(r.top+w.scrollY)+' parent='+(p?p.className:'?');});
  // appel-carte : au dessus d une video ?
  var ac=d.querySelector('.appel-carte');
  if(ac){var ra=ac.getBoundingClientRect();
    out.appelCarte={rect:Math.round(ra.width)+'x'+Math.round(ra.height), topDoc:Math.round(ra.top+w.scrollY),
      videosDerriere:(function(){var n=0;var vs=d.querySelectorAll('video');for(var i=0;i<vs.length;i++){var rv2=vs[i].getBoundingClientRect();
        if(rv2.width&&Math.abs(rv2.top-ra.top)<900)n++;}return n;})()};}
  document.getElementById('R').textContent='DEBUT'+JSON.stringify(out)+'FIN';
}
window.addEventListener('load',function(){setTimeout(go,2500);});
</script>
</body></html>

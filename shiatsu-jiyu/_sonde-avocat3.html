<!doctype html><html><head><meta charset="utf-8"><title>attente</title>
<style>html,body{margin:0}iframe{width:390px;height:800px;border:0}</style></head>
<body>
<iframe id="f" src="./index.html"></iframe>
<pre id="R">rien</pre>
<script>
function esc(s){return String(s);}
function go(){
  var f=document.getElementById('f'), d=f.contentDocument, w=f.contentWindow;
  var out={};
  out.iframeW=f.clientWidth; out.iframeH=f.clientHeight;
  out.innerW=w.innerWidth; out.innerH=w.innerHeight;
  var bloc=d.querySelector('.entree-bloc');
  if(!bloc){out.bloc='ABSENT';}
  else{
    var cs=w.getComputedStyle(bloc), r=bloc.getBoundingClientRect();
    out.bloc={
      cls:bloc.className,
      rect:[Math.round(r.width),Math.round(r.height)],
      topDoc:Math.round(r.top + w.scrollY),
      animName:cs.animationName, animTimeline:cs.animationTimeline,
      rangeStart:cs.animationRangeStart, rangeEnd:cs.animationRangeEnd,
      fill:cs.animationFillMode, opacity:cs.opacity, scale:cs.scale,
      backdrop:cs.backdropFilter, filter:cs.filter, willChange:cs.willChange
    };
    var media=bloc.querySelectorAll('img,video');
    out.blocMedia=[].map.call(media,function(m){var rr=m.getBoundingClientRect();return m.tagName+':'+m.className+':'+Math.round(rr.width)+'x'+Math.round(rr.height);});
    var anims=[];
    try{anims=bloc.getAnimations();}catch(e){}
    out.blocAnims=anims.map(function(a){
      var t=a.timeline; var kind=t?t.constructor.name:'none';
      var kf=[]; try{kf=a.effect.getKeyframes().map(function(k){var o={};for(var p in k){if(p!=='composite'&&p!=='computedOffset'&&p!=='easing')o[p]=k[p];}return o;});}catch(e){}
      return {name:(a.animationName||''),timeline:kind,current:String(a.currentTime),kf:kf};
    });
  }
  // tous les filtres de fond effectifs
  var all=d.querySelectorAll('*'), layers=[];
  for(var i=0;i<all.length;i++){
    var e=all[i], c=w.getComputedStyle(e);
    var bf=c.backdropFilter||c.webkitBackdropFilter;
    if(bf&&bf!=='none'){
      var rr=e.getBoundingClientRect();
      layers.push({sel:e.tagName+'.'+(e.className||'').toString().replace(/\s+/g,'.'),
        bf:bf, w:Math.round(rr.width), h:Math.round(rr.height),
        area:Math.round(rr.width*rr.height),
        dansBloc: !!(bloc&&bloc.contains(e)),
        visible: (c.display!=='none'&&c.visibility!=='hidden')});
    }
  }
  out.couches=layers;
  // le bouton clair de l'accueil
  var bc = bloc? bloc.querySelector('a.bouton.clair'):null;
  if(bc){var cb=w.getComputedStyle(bc), rb=bc.getBoundingClientRect();
    out.boutonClair={rect:[Math.round(rb.width),Math.round(rb.height)],
      bf:cb.backdropFilter, wbf:cb.webkitBackdropFilter, willChange:cb.willChange,
      bg:cb.backgroundColor};
  } else out.boutonClair='ABSENT dans .entree-bloc';
  // opacite/scale reelles a differents defilements
  var se=d.scrollingElement;
  out.scrollH=se.scrollHeight;
  var pts=[0,100,200,300,348,400,500,600,695,800,1000];
  out.parDefilement=[];
  for(var j=0;j<pts.length;j++){
    se.scrollTop=pts[j];
    void bloc.offsetHeight;
    var c2=w.getComputedStyle(bloc);
    var a2=[];try{a2=bloc.getAnimations().map(function(a){return String(a.currentTime);});}catch(e){}
    out.parDefilement.push(pts[j]+' -> opacity='+c2.opacity+' scale='+c2.scale+' translate='+c2.translate+' t='+a2.join(','));
  }
  se.scrollTop=0;
  document.getElementById('R').textContent = 'DEBUT'+JSON.stringify(out)+'FIN';
  document.title='ok';
}
window.addEventListener('load',function(){setTimeout(go,2500);});
</script>
</body></html>

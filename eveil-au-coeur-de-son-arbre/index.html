    <!--
      Netlify envoie ses liens d'invitation vers la RACINE du site, avec le
      jeton dans le fragment d'URL (#invite_token=...). On le fait suivre tel

      cliquer sur l'invitation n'a aucun effet visible.

      Aucun script tiers : trois lignes, et rien du tout pour un visiteur
      normal.
    -->
    <script>
      (function () {
        var h = window.location.hash || '';
        if (/(invite_token|recovery_token)=/.test(h)) {
          window.location.replace('/admin' + h);
        }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- La coupe d'un rondin : c'est ce qu'on voit quand le tour s'arrête,
       et c'est lisible à seize pixels, ce que ne serait aucune silhouette. -->
  <rect width="64" height="64" rx="14" fill="#f7f0e3"/>
  <g fill="none" stroke="#4b382a" stroke-width="3" stroke-linecap="round">
    <circle cx="32" cy="32" r="23" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="16" opacity=".8"/>
    <circle cx="32" cy="32" r="9.5" opacity=".6"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#c25a1e"/>
</svg>

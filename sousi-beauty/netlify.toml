[build]
  command = "npm run build"
  publish = "dist"

# Le site est une page unique, sans formulaire ni espace d'edition : aucune
# fonction Netlify, et aucune redirection heritee. Les redirections de l'ancien
# site (energie-et-bien-etre) ont ete retirees avec lui.

# Les medias generes ne changent jamais : cache long.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# DEMO DE PROSPECTION — tant que la cliente n'a pas donne son accord, le site
# ne doit etre ni indexe, ni reference. Le `noindex` est aussi dans le <head>
# et dans public/robots.txt. Les trois se retirent ensemble a la mise en ligne.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

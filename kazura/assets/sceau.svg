<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sceau de Kazura">
  <!--
    LE SCEAU KAZURA
    Un kamon, blason familial japonais. Les regles du genre, tenues ici :
      - symetrie radiale parfaite (trois folioles a 120 degres, comme le kuzu)
      - des aplats, jamais de contours : un kamon se teint, se grave, se brode
      - tout dans un disque, pour qu'il tienne sur un sceau comme sur un bouton
      - assez peu de details pour rester lisible a seize pixels

    La nervure de chaque foliole est un VIDE, pas un trait : c'est la regle
    `fill-rule: evenodd` qui la creuse. Un trait aurait disparu en petit,
    un vide reste lisible tant que la foliole l'est.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <!-- L'anneau -->
    <path d="M50 2a48 48 0 1 0 0 96 48 48 0 1 0 0-96zm0 7a41 41 0 1 1 0 82 41 41 0 1 1 0-82z"/>

    <!-- Trois folioles, la meme forme tournee de 120 degres -->
    <g>
      <path d="M50 44c-9-8-13-20-1.5-31.5L50 11l1.5 1.5C63 24 59 36 50 44zm0-6.5c4.6-5 6.4-11.6 0-18.6-6.4 7-4.6 13.6 0 18.6z"/>
      <path d="M50 44c-9-8-13-20-1.5-31.5L50 11l1.5 1.5C63 24 59 36 50 44zm0-6.5c4.6-5 6.4-11.6 0-18.6-6.4 7-4.6 13.6 0 18.6z" transform="rotate(120 50 50)"/>
      <path d="M50 44c-9-8-13-20-1.5-31.5L50 11l1.5 1.5C63 24 59 36 50 44zm0-6.5c4.6-5 6.4-11.6 0-18.6-6.4 7-4.6 13.6 0 18.6z" transform="rotate(240 50 50)"/>
    </g>

    <!-- Le coeur, qui noue les trois -->
    <circle cx="50" cy="50" r="5.4"/>
  </g>
</svg>
